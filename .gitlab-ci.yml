stages:
   - syntax
   - tests
   - deploy

image: tetraweb/php:7.0

before_script:
  - mkdir -p ~/.ssh
  - echo -e "$PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

deploy-main:
  stage: deploy
  script:
    - ssh -i ~/.ssh/id_rsa root@$HOST_NAME "bash /home/grafikaprinting/deploy.sh"
  environment:
    name: production
  only:
    - main
